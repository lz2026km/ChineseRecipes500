<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>中华美食千百道 v5.1</title>
<style>
:root{--c1:#C8553D;--c2:#E8A87C;--c3:#D4AF37;--bg:#FDF6EC;--sf:#FFF;--tx:#2C1810;--mt:#8B7355;--bd:#E8D5C4;--sh:rgba(44,24,16,.1);--bg2:#F5EDE3;--tx2:#1A0F0A;--season-primary:#C8553D;--season-secondary:#E8A87C;--season-accent:#D4AF37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:20px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:20px}
.card{background:var(--sf);border-radius:12px;padding:16px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px var(--sh)}
.card h3{color:var(--c1);margin-bottom:8px;font-size:1.1rem}
.card p{color:var(--mt);font-size:.85rem;line-height:1.5}
.tag{background:var(--c2);color:#fff;padding:2px 8px;border-radius:12px;font-size:.75rem;margin:2px;display:inline-block}
#cnt{margin-top:16px;font-size:1.2rem;font-weight:bold;color:var(--c1)}
</style>
</head>
<body>
<h1>🍜 中华美食千百道 v5.1</h1>
<div id="cnt">加载中…</div>
<div id="grid"></div>
<script>
// Minimal test: load DATA with fetch and render
const DATA_URL = 'https://raw.githubusercontent.com/lz2026km/ChineseRecipes500/main/recipes_data.json';
window.DATA = null;
window.filtered = [];

fetch(DATA_URL)
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d => {
    window.DATA = d;
    window.filtered = d;
    document.getElementById('cnt').textContent = 'Loaded ' + d.length + ' recipes';
    const grid = document.getElementById('grid');
    grid.innerHTML = d.slice(0,12).map(item =>
      '<div class="card"><h3>'+item.name+'</h3><p>'+(item.era||'')+' '+(item.category||'')+'</p>' +
      (item.effect?'<span class="tag">'+item.effect+'</span>':'') +
      '</div>'
    ).join('');
    console.log('DATA loaded:', d.length);
  })
  .catch(err => {
    document.getElementById('cnt').textContent = 'Error: ' + err.message;
    console.error(err);
  });
</script>
</body>
</html>
