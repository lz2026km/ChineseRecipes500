<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中华美食五百道</title>
  <style>
    :root{--c1:#C8553D;--c2:#E8A87C;--c3:#D4AF37;--bg:#FDF6EC;--sf:#FFF;--tx:#2C1810;--mt:#8B7355;--bd:#E8D5C4;--sh:rgba(44,24,16,.1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh}
    .aurora{height:6px;background:linear-gradient(90deg,#C8553D,#E8A87C,#D4AF37,#E8A87C,#C8553D,#D4AF37);background-size:200% 100%;animation:aurora 8s ease infinite}
    @keyframes aurora{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 20px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px var(--sh)}
    .hdr-tl{font-size:1.2rem;font-weight:700;color:var(--c1);white-space:nowrap;font-family:"Songti SC",SimSun,serif}
    .hdr-tl span{color:var(--c3)}
    .srch{flex:1;max-width:420px;position:relative}
    .srch input{width:100%;height:38px;padding:0 14px 0 38px;border:1.5px solid var(--bd);border-radius:19px;font-size:.875rem;background:var(--bg);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
    .srch input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(200,85,61,.12)}
    .srch span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mt)}
    .btn-rnd{height:38px;padding:0 18px;background:var(--c1);color:#fff;border:none;border-radius:19px;font-size:.825rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}
    .btn-rnd:hover{background:#a8442e;transform:scale(1.03)}
    .ly{display:flex;min-height:calc(100vh - 66px)}
    .sd{width:190px;min-width:190px;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto}
    .sd-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mt);padding:0 8px;margin-bottom:6px}
    .sd-sep{margin:12px 0 8px;border:none;border-top:1px solid var(--bd)}
    .era-btn,.cat-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 10px;border:none;border-radius:6px;background:transparent;color:var(--tx);font-size:.825rem;cursor:pointer;text-align:left;transition:background .12s,color .12s;margin-bottom:2px}
    .era-btn:hover,.cat-btn:hover{background:var(--bg)}
    .era-btn.on,.cat-btn.on{background:var(--c1);color:#fff}
    .era-btn.on .cnt,.cat-btn.on .cnt{background:rgba(255,255,255,.3);color:#fff}
    .cat-btn.on{background:var(--c2);color:var(--tx)}
    .era-btn .cnt,.cat-btn .cnt{font-size:.65rem;background:var(--bd);color:var(--mt);padding:1px 6px;border-radius:10px}
    .mn{flex:1;padding:20px}
    .mn-ttl{font-size:.9rem;color:var(--mt);margin-bottom:16px}
    .mn-ttl strong{color:var(--c1);font-size:1.2rem}
    .grd{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .card{background:var(--sf);border-radius:12px;box-shadow:0 2px 12px var(--sh);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;border:1px solid var(--bd);outline:none}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px var(--sh)}
    .card:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
    .ci{position:relative;width:100%;padding-top:58%;background:var(--bg);overflow:hidden}
    .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .card:hover .ci img{transform:scale(1.06)}
    .ci-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;background:linear-gradient(135deg,#f5e6d3,#e8d5c4)}
    .ci-tg{position:absolute;top:6px;left:6px;background:var(--c1);color:#fff;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:8px}
    .ci-hv{position:absolute;bottom:8px;right:8px;background:var(--c1);color:#fff;font-size:.65rem;padding:3px 9px;border-radius:8px;display:none}
    .card:hover .ci-hv{display:block}
    .cb{padding:10px 12px}
    .cn{font-family:"Songti SC",SimSun,serif;font-size:.9rem;font-weight:700;margin-bottom:3px;line-height:1.3}
    .cs{font-size:.7rem;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cta{font-size:.65rem;color:var(--c1);font-weight:600;margin-top:4px;display:none}
    .card:hover .cta{display:block}
    .mb{display:none;position:fixed;inset:0;background:rgba(44,24,16,.55);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:16px}
    .mb.on{display:flex}
    .md{background:var(--sf);border-radius:20px;box-shadow:0 8px 40px rgba(44,24,16,.22);max-width:800px;width:100%;max-height:88vh;overflow-y:auto;position:relative;animation:mdIn .25s ease}
    @keyframes mdIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .md-cls{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--sf);border-bottom:1px solid var(--bd)}
    .md-id{font-size:.7rem;color:var(--mt);font-weight:600}
    .md-x{width:34px;height:34px;border:none;background:var(--bg);border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
    .md-x:hover{background:var(--bd)}
    .md-h{position:relative;width:100%;height:260px;background:var(--bg);overflow:hidden}
    .md-h img{width:100%;height:100%;object-fit:cover}
    .md-h-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,#f5e6d3,#e8d5c4)}
    .md-bdg{position:absolute;bottom:14px;left:14px;background:var(--c1);color:#fff;font-size:.75rem;font-weight:700;padding:3px 12px;border-radius:10px}
    .md-by{position:absolute;bottom:14px;right:14px;background:rgba(0,0,0,.4);color:#fff;font-size:.65rem;padding:3px 10px;border-radius:8px}
    .md-bd{padding:20px}
    .md-n{font-family:"Songti SC",SimSun,serif;font-size:1.5rem;font-weight:700;margin-bottom:8px}
    .md-mg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .md-tg{font-size:.72rem;color:var(--mt);background:var(--bg);padding:3px 10px;border-radius:10px;border:1px solid var(--bd)}
    .md-sc{margin-bottom:16px}
    .md-sb{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c3);border-left:3px solid var(--c3);padding-left:7px;margin-bottom:6px}
    .md-tx{font-size:.875rem;line-height:1.9;white-space:pre-line;color:var(--tx)}
    .md-tx.sm{font-size:.8rem;color:var(--mt)}
    .stp{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
    .sn{flex-shrink:0;width:22px;height:22px;background:var(--c1);color:#fff;border-radius:50%;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
    .md-nav{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 20px;background:var(--sf);border-top:1px solid var(--bd)}
    .md-nav-btn{flex:1;height:38px;border:1.5px solid var(--bd);background:var(--sf);border-radius:19px;font-size:.8rem;cursor:pointer;color:var(--tx);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .12s}
    .md-nav-btn:hover{border-color:var(--c1);color:var(--c1);background:rgba(200,85,61,.05)}
    .emp{text-align:center;padding:60px;color:var(--mt)}
    .emp .ic{font-size:2.8rem;margin-bottom:10px}
    *:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
    @media(max-width:640px){.sd{display:none}.grd{grid-template-columns:repeat(2,1fr);gap:10px}.mn{padding:14px}.md-h{height:180px}}
  </style>
</head>
<body>
<div class="aurora"></div>
<header class="hdr">
  <div class="hdr-tl">🍜 中华<span>美食</span>五百道</div>
  <div class="srch"><span>🔍</span><input type="search" id="srch" placeholder="搜索菜名…" aria-label="搜索菜谱" autocomplete="off"></div>
  <button class="btn-rnd" id="rnd">🎲 随便看看</button>
</header>
<div class="ly">
  <nav class="sd" aria-label="筛选">
    <div class="sd-lbl">🌿 食材分类</div>
    <div id="catFilters" role="group"></div>
    <hr class="sd-sep">
    <div class="sd-lbl">📅 朝代</div>
    <div id="eraFilters" role="group"></div>
  </nav>
  <main class="mn">
    <div class="mn-ttl" id="cnt">加载中…</div>
    <div class="grd" id="grid" role="list"></div>
    <div class="emp" id="emp" style="display:none"><div class="ic">🍽️</div><p>未找到相关菜谱</p></div>
  </main>
</div>
<div class="mb" id="mb" role="dialog" aria-modal="true" aria-label="菜谱详情">
  <div class="md" id="md">
    <div class="md-cls"><span class="md-id" id="mdId"></span><button class="md-x" id="mdX" aria-label="关闭">✕</button></div>
    <div class="md-h" id="mdH"></div>
    <div class="md-bd" id="mdBd"></div>
    <div class="md-nav">
      <button class="md-nav-btn" id="mdPrev">← 上一道</button>
      <button class="md-nav-btn" id="mdNext">下一道 →</button>
    </div>
  </div>
</div>
<script>
// Fetch data from external JSON file
(async function() {
  try {
    const res = await fetch('./recipes_data.json');
    if (!res.ok) throw new Error('Failed to load data');
    const DATA = await res.json();
    
    const CATS = {};
    DATA.forEach(d => {
      const cat = d.category || '🍽️ 其他';
      if (!CATS[cat]) CATS[cat] = [];
      CATS[cat].push(d);
    });

    const CAT_ICONS = {
      '🐷 猪肉类':'🐷','🐂 牛肉类':'🐂','🐑 羊肉类':'🐑','🐔 鸡肉类':'🐔',
      '🦆 鸭肉类':'🦆','🦢 鹅肉类':'🦢','🐟 鱼类':'🐟','🦐 虾蟹类':'🦐',
      '🦀 蟹类':'🦀','🦑 海参鲍鱼类':'🦑','🦑 贝类':'🦑',
      '🥬 蔬菜类':'🥬','🥒 瓜类':'🥒','🍅 茄果类':'🍅','🌶️ 辛香类':'🌶️',
      '🧅 辛香类':'🧅','🍠 根茎类':'🍠','🥕 根茎类':'🥕',
      '🎋 菌笋类':'🎋','🍄 菌笋类':'🍄',
      '🧈 豆制品类':'🧈','🥚 蛋类':'🥚','🍚 米面主食类':'🍚',
      '🍜 米面主食类':'🍜','🥟 米面主食类':'🥟','🥖 米面主食类':'🥖',
      '🍲 汤羹类':'🍲','🍰 甜品糕点类':'🍰','🍬 糖果蜜饯类':'🍬',
      '🩸 内脏血类':'🩸','🍶 酒类':'🍶','🍽️ 其他':'🍽️'
    };

    const ERAS = ['全部','先秦·汉·魏晋','唐代','元代','唐代（续）','宋代（续）','宋代','明代','清代','近代·现代'];

    let curCat = '全部', curEra = '全部', curQ = '';
    let filtered = [...DATA], mIdx = -1;

    const grid = document.getElementById('grid');
    const cntEl = document.getElementById('cnt');
    const empEl = document.getElementById('emp');
    const mb = document.getElementById('mb');

    function buildSidebar() {
      const cg = document.getElementById('catFilters');
      cg.innerHTML = '';
      const catList = Object.entries(CATS).sort((a,b)=>b[1].length-a[1].length);
      const allBtn = document.createElement('button');
      allBtn.className = 'cat-btn on';
      allBtn.innerHTML = `<span>🍽️ 全部</span><span class="cnt">${DATA.length}</span>`;
      allBtn.onclick = () => selCat('全部', allBtn);
      cg.appendChild(allBtn);
      catList.forEach(([cat,arr])=>{
        const b = document.createElement('button');
        b.className = 'cat-btn';
        b.innerHTML = `<span>${CAT_ICONS[cat]||'🍽️'} ${cat.split(' ')[1]||cat}</span><span class="cnt">${arr.length}</span>`;
        b.onclick = () => selCat(cat, b);
        cg.appendChild(b);
      });

      const eg = document.getElementById('eraFilters');
      eg.innerHTML = '';
      const eraCnt = {};
      DATA.forEach(d=>{ eraCnt[d.era]=~~eraCnt[d.era]+1 });
      ERAS.forEach(era=>{
        const b = document.createElement('button');
        const isAll = era==='全部';
        const c = isAll ? DATA.length : (eraCnt[era]||0);
        b.className = 'era-btn'+(isAll?' on':'');
        const short = era.split('·')[1]||era.split('（')[0]||era;
        b.innerHTML = `<span>${short}</span><span class="cnt">${c}</span>`;
        b.onclick = ()=>{ document.querySelectorAll('.era-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); curEra=era; apply(); };
        eg.appendChild(b);
      });
    }

    function selCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('on'));
      btn.classList.add('on');
      curCat = cat;
      apply();
    }

    function apply() {
      const q = curQ.toLowerCase();
      filtered = DATA.filter(d=>{
        const okCat = curCat==='全部' || d.category===curCat;
        const okEra = curEra==='全部' || d.era===curEra;
        const okQ = !q || d.name.toLowerCase().includes(q) || (d.source&&d.source.toLowerCase().includes(q));
        return okCat && okEra && okQ;
      });
      render();
    }

    function render() {
      cntEl.innerHTML = `共 <strong>${filtered.length}</strong> 道菜`;
      grid.innerHTML = '';
      if (!filtered.length) { grid.style.display='none'; empEl.style.display='block'; return; }
      grid.style.display=''; empEl.style.display='none';
      filtered.forEach((d,i)=>{
        const c = document.createElement('article');
        c.className='card'; c.setAttribute('tabindex','0'); c.dataset.i=i;
        const ph = `<div class="ci-ph">${CAT_ICONS[d.category]||'🍽️'}</div>`;
        const img = d.image ? `<img src="${d.image}" alt="${d.name}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML+='${ph}'">` : ph;
        c.innerHTML=`<div class="ci">${img}<span class="ci-tg">${d.era}</span><span class="ci-hv">查看做法</span></div>
          <div class="cb"><div class="cn">${d.name}</div><div class="cs">${d.source||'来源待考'}</div><div class="cta">${(d.category.split(' ')[0])+' '+(d.category.split(' ')[1]||'')}</div></div>`;
        c.onclick=()=>openM(i);
        c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openM(i);}};
        grid.appendChild(c);
      });
    }

    function openM(i) {
      mIdx=i; const d=filtered[i];
      document.getElementById('mdId').textContent=`#${d.id} ${d.name}`;
      const ph2=d.image?`<img src="${d.image}" alt="${d.name}" onerror="this.parentElement.innerHTML='<div class=md-h-ph>${CAT_ICONS[d.category]||'🍽️'}</div>'">`:`<div class="md-h-ph">${CAT_ICONS[d.category]||'🍽️'}</div>`;
      document.getElementById('mdH').innerHTML=ph2+`<span class="md-bdg">${d.era}</span>`+(d.source?`<span class="md-by">📖 ${d.source}</span>`:'');
      let bd=`<h2 class="md-n">${d.name}</h2><div class="md-mg"><span class="md-tg">🌿 ${d.category}</span><span class="md-tg">📅 ${d.era}</span></div>`;
      if(d.history) bd+=`<div class="md-sc"><div class="md-sb">历史背景</div><p class="md-tx">${d.history}</p></div>`;
      if(d.authorBio) bd+=`<div class="md-sc"><div class="md-sb">作者简介</div><p class="md-tx sm">${d.authorBio}</p></div>`;
      if(d.ingredients) bd+=`<div class="md-sc"><div class="md-sb">食材·用量</div><p class="md-tx">${d.ingredients}</p></div>`;
      if(d.steps) {
        const stps=d.steps.split('\n').filter(s=>s.trim());
        const stpHtml=stps.map((s,i)=>`<div class="stp"><span class="sn">${i+1}</span><span class="md-tx">${s.replace(/^\d+\.\s*/,'')}</span></div>`).join('');
        bd+=`<div class="md-sc"><div class="md-sb">详细步骤</div>${stpHtml}</div>`;
      }
      if(d.tips) bd+=`<div class="md-sc"><div class="md-sb">烹饪要点</div><p class="md-tx sm">💡 ${d.tips}</p></div>`;
      if(!d.steps&&!d.ingredients) bd+=`<div class="md-sc"><div class="md-sb">📜 古籍原文</div><p class="md-tx sm">此菜见于古籍，记载简略，详情待考。</p></div>`;
      document.getElementById('mdBd').innerHTML=bd;
      mb.classList.add('on'); document.body.style.overflow='hidden';
    }

    function closeM(){ mb.classList.remove('on'); document.body.style.overflow=''; }

    document.getElementById('srch').addEventListener('input',e=>{ curQ=e.target.value; apply(); });
    document.getElementById('rnd').addEventListener('click',()=>{ if(filtered.length) openM(Math.floor(Math.random()*filtered.length)); });
    document.getElementById('mdX').addEventListener('click',closeM);
    mb.addEventListener('click',e=>{ if(e.target===mb) closeM(); });
    document.getElementById('mdPrev').addEventListener('click',()=>{ if(mIdx>0) openM(mIdx-1); });
    document.getElementById('mdNext').addEventListener('click',()=>{ if(mIdx<filtered.length-1) openM(mIdx+1); });
    document.addEventListener('keydown',e=>{
      if(!mb.classList.contains('on')) return;
      if(e.key==='Escape') closeM();
      if(e.key==='ArrowLeft'){if(mIdx>0) openM(mIdx-1);}
      if(e.key==='ArrowRight'){if(mIdx<filtered.length-1) openM(mIdx+1);}
    });

    buildSidebar(); render();
  } catch(err) {
    document.getElementById('cnt').innerHTML = '<strong style="color:red">加载失败: '+err.message+'</strong>';
    console.error(err);
  }
})();
</script>
</body>
</html>
