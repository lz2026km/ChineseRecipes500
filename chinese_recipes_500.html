<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500道中国菜谱</title>
  <style>
    /* ===== Design Tokens (ui-ux-pro-max) ===== */
    :root {
      --color-primary:   #C8553D;
      --color-secondary: #E8A87C;
      --color-accent:    #D4AF37;
      --color-bg:        #FDF6EC;
      --color-surface:   #FFFFFF;
      --color-text:      #2C1810;
      --color-muted:     #8B7355;
      --color-border:    #E8D5C4;
      --color-shadow:    rgba(44,24,16,0.10);

      --font-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;

      --shadow-card: 0 2px 12px var(--color-shadow);
      --shadow-modal: 0 8px 40px rgba(44,24,16,0.22);

      --transition-fast: 150ms ease;
      --transition-mid:  250ms ease;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== Aurora Top Banner ===== */
    .aurora-banner {
      height: 6px;
      background: linear-gradient(90deg,
        #C8553D 0%, #E8A87C 20%, #D4AF37 40%,
        #E8A87C 60%, #C8553D 80%, #D4AF37 100%);
      background-size: 200% 100%;
      animation: aurora 8s ease infinite;
    }
    @keyframes aurora {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Header ===== */
    .header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 8px var(--color-shadow);
    }

    .header-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title .gold { color: var(--color-accent); }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 16px 0 40px;
      border: 1.5px solid var(--color-border);
      border-radius: 20px;
      font-size: 0.9rem;
      background: var(--color-bg);
      color: var(--color-text);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(200,85,61,0.12);
    }

    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-muted);
      font-size: 1rem;
    }

    .btn-random {
      height: 40px;
      padding: 0 20px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .btn-random:hover {
      background: #a8442e;
      transform: scale(1.03);
    }

    .btn-random:active { transform: scale(0.97); }

    /* ===== Layout ===== */
    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 20px 12px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
    }

    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .era-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text);
      font-size: 0.875rem;
      cursor: pointer;
      text-align: left;
      transition: background var(--transition-fast), color var(--transition-fast);
      margin-bottom: 2px;
    }

    .era-btn:hover { background: var(--color-bg); }

    .era-btn.active {
      background: var(--color-primary);
      color: #fff;
    }

    .era-btn .count {
      font-size: 0.7rem;
      background: var(--color-border);
      color: var(--color-muted);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .era-btn.active .count {
      background: rgba(255,255,255,0.3);
      color: #fff;
    }

    /* ===== Main Content ===== */
    .main {
      flex: 1;
      padding: 24px;
      overflow-x: hidden;
    }

    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .main-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--color-muted);
    }

    .main-title strong {
      color: var(--color-primary);
      font-size: 1.3rem;
    }

    /* ===== Recipe Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ===== Recipe Card ===== */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition-mid), box-shadow var(--transition-mid);
      border: 1px solid var(--color-border);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--color-shadow);
    }

    .card:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 60%;
      background: var(--color-bg);
      overflow: hidden;
    }

    .card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 400ms ease;
    }

    .card:hover .card-img-wrap img { transform: scale(1.06); }

    .card-img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 2.5rem;
    }

    .card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .card-body {
      padding: 12px 14px;
    }

    .card-name {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-source {
      font-size: 0.75rem;
      color: var(--color-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-hover-hint {
      display: none;
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .card:hover .card-hover-hint { display: block; }

    /* ===== Modal ===== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,24,16,0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: modalIn 250ms ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-close {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .modal-close-id {
      font-size: 0.75rem;
      color: var(--color-muted);
      font-weight: 600;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--color-bg);
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
    }

    .modal-close-btn:hover { background: var(--color-border); }

    .modal-hero {
      position: relative;
      width: 100%;
      height: 300px;
      background: var(--color-bg);
      overflow: hidden;
    }

    .modal-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-hero-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 4rem;
    }

    .modal-hero-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 12px;
    }

    .modal-body { padding: 24px; }

    .modal-name {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .modal-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .modal-meta-tag {
      font-size: 0.78rem;
      color: var(--color-muted);
      background: var(--color-bg);
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }

    .modal-section {
      margin-bottom: 20px;
    }

    .modal-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-accent);
      border-left: 3px solid var(--color-accent);
      padding-left: 8px;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 0.9rem;
      color: var(--color-text);
      line-height: 1.8;
      white-space: pre-line;
    }

    .modal-steps .modal-text {
      counter-reset: step;
      padding-left: 0;
    }

    .modal-steps .step {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      align-items: flex-start;
    }

    .step-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      background: var(--color-primary);
      color: #fff;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .modal-nav {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 14px 24px;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }

    .modal-nav-btn {
      flex: 1;
      height: 40px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--color-text);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .modal-nav-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: rgba(200,85,61,0.05);
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; }

    /* ===== Loading Skeleton ===== */
    .skeleton { animation: shimmer 1.5s infinite; }
    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== Mobile Responsive ===== */
    @media (max-width: 640px) {
      .sidebar {
        display: none;
      }
      .header {
        padding: 0 16px;
        gap: 10px;
      }
      .header-title { font-size: 1rem; }
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .main { padding: 16px; }
      .modal-hero { height: 200px; }
      .modal-body { padding: 16px; }
    }

    /* ===== Focus Visible ===== */
    *:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* ===== Era Color Map for Placeholder ===== */
    .era-qin    { background: linear-gradient(135deg, #f5e6d3, #e8d5c4); }
    .era-tang    { background: linear-gradient(135deg, #fde8d8, #f5d0b0); }
    .era-yuan    { background: linear-gradient(135deg, #fde8d0, #f5c8a0); }
    .era-song    { background: linear-gradient(135deg, #e8f0e8, #c8e0c8); }
    .era-ming    { background: linear-gradient(135deg, #f0e8d8, #d8c8a8); }
    .era-qing    { background: linear-gradient(135deg, #e8e4f0, #c8c0e0); }
    .era-jindai  { background: linear-gradient(135deg, #f0e8e8, #e0c8c8); }
  </style>
</head>

<div class="aurora-banner"></div>

<!-- ===== Header ===== -->
<header class="header" role="banner">
  <div class="header-title">
    <span>🍜</span>
    <span>500道<span class="gold">中国</span>菜谱</span>
  </div>

  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input
      type="search"
      id="searchInput"
      placeholder="搜索菜名..."
      aria-label="搜索菜谱"
      autocomplete="off"
    >
  </div>

  <button class="btn-random" id="btnRandom" aria-label="随机一道菜">
    🎲 随便看看

</header>

<!-- ===== Layout ===== -->
<div class="layout">

  <nav class="sidebar" aria-label="朝代筛选">
    <div class="sidebar-label">朝代</div>

      <!-- 动态生成 -->
    </div>
  </nav>

  <!-- ===== Main ===== -->
  <main class="main" role="main">
    <div class="main-header">
      <div class="main-title" id="resultCount">
        共 <strong>500</strong> 道菜
      </div>
    </div>

    <div class="grid" id="recipeGrid" role="list" aria-label="菜谱列表">
      <!-- 动态生成 -->
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">🍽️</div>
      <p>未找到相关菜谱</p>
      <p style="font-size:0.8rem;margin-top:6px">换个关键词试试</p>
    </div>
  </main>
</div>

<!-- ===== Modal ===== -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="菜谱详情">
  <div class="modal" id="modalContent">
    <div class="modal-close">
      <span class="modal-close-id" id="modalId"></span>
      <button class="modal-close-btn" id="modalClose" aria-label="关闭">✕</button>
    </div>

    <div class="modal-hero" id="modalHero">
      <!-- 图片或占位 -->
    </div>

    <div class="modal-body" id="modalBody">
      <!-- 详情内容 -->
    </div>

    <div class="modal-nav">
      <button class="modal-nav-btn" id="btnPrev">← 上一道</button>
      <button class="modal-nav-btn" id="btnNext">下一道 →</button>
    </div>
  </div>
</div>

"name": "响油鳝糊", "era": "近代·现代", "image": null}, {"id": "485", "name": "水晶肴肉", "era": "近代·现代", "image": null}, {"id": "486", "name": "碧螺虾仁", "era": "近代·现代", "image": null}, {"id": "487", "name": "红烧圈子", "era": "近代·现代", "image": null}, {"id": "488", "name": "清炖狮子头", "era": "近代·现代", "image": null}, {"id": "489", "name": "樱桃肉", "era": "近代·现代", "image": null}, {"id": "490", "name": "粉蒸肉", "era": "近代·现代", "image": null}, {"id": "491", "name": "干菜焖肉", "era": "近代·现代", "image": null}, {"id": "492", "name": "香酥鸭", "era": "近代·现代", "image": null}, {"id": "493", "name": "盐焗鸡", "era": "近代·现代", "image": null}, {"id": "494", "name": "白灼虾", "era": "近代·现代", "image": null}, {"id": "495", "name": "避风塘炒蟹", "era": "近代·现代", "image": null}, {"id": "496", "name": "豉汁蒸排骨", "era": "近代·现代", "image": null}, {"id": "497", "name": "咕噜肉", "era": "近代·现代", "image": null}, {"id": "498", "name": "叉烧包", "era": "近代·现代", "image": null}, {"id": "499", "name": "虾饺", "era": "近代·现代", "image": null}, {"id": "500", "name": "蛋挞", "era": "近代·现代", "image": null}];

// ===== State =====
let currentEra = '全部';
let currentSearch = '';
let filtered = [...RECIPES];
let modalIndex = -1;

// ===== DOM refs =====
const grid = document.getElementById('recipeGrid');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');
const eraFilters = document.getElementById('eraFilters');
const searchInput = document.getElementById('searchInput');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalHero = document.getElementById('modalHero');
const modalBody = document.getElementById('modalBody');
const modalId = document.getElementById('modalId');

// ===== Era SVG Icons (古典风格) =====
const ERA_ICONS = {
  '先秦·汉·魏晋': '🏺',
  '唐代': '🏯',
  '元代': '🐎',
  '唐代（续）': '🏯',
  '宋代（续）': '🏮',
  '宋代': '🏮',
  '明代': '🕌',
  '清代': '🏛️',
  '近代·现代': '🍳'
};

// ===== Era color classes =====
const ERA_CLASS = {
  '先秦·汉·魏晋': 'era-qin',
  '唐代': 'era-tang',
  '元代': 'era-yuan',
  '唐代（续）': 'era-tang',
  '宋代（续）': 'era-song',
  '宋代': 'era-song',
  '明代': 'era-ming',
  '清代': 'era-qing',
  '近代·现代': 'era-jindai',
};

// ===== Init =====
function init() {
  buildEraFilters();
  render();
  bindEvents();
}

// ===== Build Era Filters =====
function buildEraFilters() {
  const eras = ['全部', ...Object.keys(ERA_ICONS).filter(e => e !== '全部')];
  const counts = {};
  RECIPES.forEach(r => { counts[r.era] = (counts[r.era] || 0) + 1; });

  eraFilters.innerHTML = '';
  eras.forEach(era => {
    const btn = document.createElement('button');
    btn.className = 'era-btn' + (era === '全部' ? ' active' : '');
    btn.setAttribute('aria-pressed', era === '全部');
    const cnt = era === '全部' ? RECIPES.length : (counts[era] || 0);
    btn.innerHTML = `<span>${ERA_ICONS[era] || '📜'} ${era}</span><span class="count">${cnt}</span>`;
    btn.addEventListener('click', () => selectEra(era, btn));
    eraFilters.appendChild(btn);
  });
}

function selectEra(era, btn) {
  currentEra = era;
  document.querySelectorAll('.era-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-pressed', 'true');
  applyFilter();
}

// ===== Filter =====
function applyFilter() {
  const q = currentSearch.trim().toLowerCase();
  filtered = RECIPES.filter(r => {
    const matchEra = currentEra === '全部' || r.era === currentEra;
    const matchQ = !q || r.name.toLowerCase().includes(q) ||
      (r.source && r.source.toLowerCase().includes(q));
    return matchEra && matchQ;
  });
  render();
}

// ===== Render Grid =====
function render() {
  resultCount.innerHTML = `共 <strong>${filtered.length}</strong> 道菜`;
  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }

  grid.style.display = '';
  emptyState.style.display = 'none';

  filtered.forEach((dish, idx) => {
    const card = createCard(dish, idx);
    grid.appendChild(card);
  });
}

function createCard(dish, idx) {
  const article = document.createElement('article');
  article.className = 'card';
  article.setAttribute('role', 'listitem');
  article.setAttribute('tabindex', '0');
  article.setAttribute('aria-label', `${dish.id} ${dish.name}`);
  article.dataset.idx = idx;

  const eraClass = ERA_CLASS[dish.era] || 'era-qin';
  const imgHtml = dish.image
    ? `<img src="${dish.image}" alt="${dish.name}" loading="lazy" onerror="this.parentElement.innerHTML=makePlaceholder('${dish.era}','${dish.id}')">`
    : `${makePlaceholder(dish.era, dish.id)}`;

  article.innerHTML = `
    <div class="card-img-wrap">
      ${imgHtml}
      <span class="card-badge">${dish.era}</span>
      <span class="card-hover-hint">查看做法</span>
    </div>
    <div class="card-body">
      <div class="card-name">${dish.name}</div>
      <div class="card-source">${dish.source || '来源待考'}</div>
    </div>
  `;

  article.addEventListener('click', () => openModal(idx));
  article.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(idx); }
  });

  return article;
}

function makePlaceholder(era, id) {
  const icon = ERA_ICONS[era] || '📜';
  const cls = ERA_CLASS[era] || 'era-qin';
  return `<div class="card-img-placeholder ${cls}">
    <span>${icon}</span>
    <span style="font-size:0.6rem;color:var(--color-muted)">${id}</span>
  </div>`;
}

// ===== Modal =====
function openModal(idx) {
  modalIndex = idx;
  const dish = filtered[idx];
  renderModal(dish);
  modalBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('btnRandom').focus();
}

function closeModal() {
  modalBackdrop.classList.remove('open');
  document.body.style.overflow = '';
  // Return focus to card
  const card = grid.querySelector(`[data-idx="${modalIndex}"]`);
  if (card) card.focus();
}

function renderModal(dish) {
  modalId.textContent = `#${dish.id}`;

  const eraClass = ERA_CLASS[dish.era] || 'era-qin';
  const heroHtml = dish.image
    ? `<img src="${dish.image}" alt="${dish.name}" onerror="this.parentElement.innerHTML=makeModalPlaceholder('${dish.era}')">`
    : makeModalPlaceholder(dish.era);

  modalHero.innerHTML = `
    ${heroHtml}
    <span class="modal-hero-badge">${dish.era}</span>
  `;

  const steps = dish.steps
    ? dish.steps.split(/\n+/).filter(s => s.trim())
    : ['（详细步骤待补充）'];

  const stepsHtml = steps.map((s, i) =>
    `<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.replace(/^\d+[.、)]\s*/, '')}</span></div>`
  ).join('');

  modalBody.innerHTML = `
    <h2 class="modal-name">${dish.name}</h2>
    <div class="modal-meta">
      <span class="modal-meta-tag">📅 ${dish.era}</span>
      ${dish.source ? `<span class="modal-meta-tag">📖 ${dish.source}</span>` : ''}
    </div>

    ${dish.history ? `
    <div class="modal-section">
      <div class="modal-section-title">历史背景</div>
      <p class="modal-text">${dish.history}</p>
    </div>` : ''}

    ${dish.ingredients ? `
    <div class="modal-section">
      <div class="modal-section-title">食材·用量</div>
      <p class="modal-text">${dish.ingredients}</p>
    </div>` : ''}

    ${dish.steps ? `
    <div class="modal-section modal-steps">
      <div class="modal-section-title">详细步骤</div>
      <div class="modal-text">${stepsHtml}</div>
    </div>` : ''}

    ${dish.tips ? `
    <div class="modal-section">
      <div class="modal-section-title">烹饪要点</div>
      <p class="modal-text">${dish.tips}</p>
    </div>` : ''}
  `;
}

function makeModalPlaceholder(era) {
  const icon = ERA_ICONS[era] || '📜';
  const cls = ERA_CLASS[era] || 'era-qin';
  return `<div class="modal-hero-placeholder ${cls}">
    <span>${icon}</span>
    <span style="font-size:1rem;color:var(--color-muted)">暂无图片</span>
  </div>`;
}

// ===== Navigation =====
function goPrev() {
  if (modalIndex > 0) openModal(modalIndex - 1);
}
function goNext() {
  if (modalIndex < filtered.length - 1) openModal(modalIndex + 1);
}

// ===== Random =====
function goRandom() {
  if (filtered.length === 0) return;
  const idx = Math.floor(Math.random() * filtered.length);
  openModal(idx);
}

// ===== Bind Events =====
function bindEvents() {
  // Search
  let debounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      currentSearch = searchInput.value;
      applyFilter();
    }, 200);
  });

  // Random button
  document.getElementById('btnRandom').addEventListener('click', goRandom);

  // Modal close
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', e => {
    if (e.target === modalBackdrop) closeModal();
  });

  // Modal nav
  document.getElementById('btnPrev').addEventListener('click', goPrev);
  document.getElementById('btnNext').addEventListener('click', goNext);

  // Keyboard
  document.addEventListener('keydown', e => {
    if (!modalBackdrop.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') goPrev();
    if (e.key === 'ArrowRight') goNext();
  });
}

// ===== Start =====
init();
</script>
</body>
</html>
